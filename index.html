        // SHA-256 Hash Helper for Passwords
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            if (type === 'success') {
                toastIcon.setAttribute('data-lucide', 'check-circle-2');
                toast.className = 'fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3 rounded-xl border border-emerald-500/50 bg-emerald-950/80 text-emerald-200 shadow-2xl transition-all duration-300';

        function togglePasswordVisibility(fieldId) {
            const input = document.getElementById(fieldId);
            const icon = document.getElementById('eye-' + fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        async function handleAuthLogin(e, expectedRole) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            const db = getDB();
            const user = db.users.find(u => u.username.toLowerCase() === username.toLowerCase());

            if (!user) {
                showToast('User not found. Check username or contact Admin.', 'error');
                return;
            }

            if (user.status !== 'active') {
                showToast('Account has been deactivated by administration.', 'error');
                return;
            }

            const hashed = await sha256(password);
            if (user.passwordHash !== hashed) {
                showToast('Invalid credentials provided.', 'error');
                return;
            }

            if (user.role !== expectedRole) {
                showToast(`Role mismatch: Account is registered as ${user.role}.`, 'error');
                return;
            }

            // Successful login
            setSession(user);
            showToast(`Welcome back, ${user.name}!`, 'success');

            if (user.role === 'admin') {
                navigate('admin-dashboard');
            } else {
                navigate('student-dashboard');
            }
        }

        /**
         * 5. DEDICATED VIDEO LEARNING PAGE
         */
        function renderLearnPage(courseId, classId) {
            const db = getDB();
            const course = db.courses.find(c => c.id === courseId);
            
            // Check enrollment
            const isAssigned = db.enrollments.some(e => e.studentId === currentUser.id && e.courseId === courseId);
            if (!isAssigned && currentUser.role !== 'admin') {
                showToast('Access denied to course materials.', 'error');
                navigate('student-dashboard');
                return;
            }

            const classes = db.classes
                .filter(c => c.courseId === courseId && (c.published || currentUser.role === 'admin'))
                .sort((a,b) => a.order - b.order);

            let currentClass = classes.find(c => c.id === classId) || classes[0];
            if (!currentClass) {
                showToast('No published classes found', 'error');
                navigate('course', { courseId });
                return;
            }

            const currentIndex = classes.findIndex(c => c.id === currentClass.id);
            const prevClass = currentIndex > 0 ? classes[currentIndex - 1] : null;
            const nextClass = currentIndex < classes.length - 1 ? classes[currentIndex + 1] : null;

            const isClassCompleted = db.progress.some(p => p.studentId === currentUser.id && p.classId === currentClass.id && p.completed);

            app.innerHTML = `

                                    </div>

                                    <!-- MARK AS COMPLETED BUTTON -->

                                            class="px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${isClassCompleted ? 'bg-emerald-500 text-black' : 'bg-slate-800 text-cyan-400 border border-cyan-500/30 hover:bg-slate-700'}">

                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>

        function toggleCompleteClass(courseId, classId) {
            const db = getDB();
            const existingIndex = db.progress.findIndex(p => p.studentId === currentUser.id && p.classId === classId);

            if (existingIndex >= 0) {
                // Toggle off
                db.progress.splice(existingIndex, 1);
                saveDB(db);
                showToast('Progress removed for this class', 'info');
            } else {
                // Add completed
                const now = new Date().toISOString().split('T')[0];
                db.progress.push({
                    studentId: currentUser.id,
                    classId: classId,
                    completed: true,
                    timestamp: now
                });
                saveDB(db);
                showToast('Class completed! Progress recorded in academy database.', 'success');
            }

            renderLearnPage(courseId, classId);
        }

        // Student status toggle
        function toggleStudentStatus(studentId) {
            const db = getDB();
            const student = db.users.find(u => u.id === studentId);
            if (!student) return;
            student.status = student.status === 'active' ? 'inactive' : 'active';
            saveDB(db);
            showToast(`Student ${student.name} is now ${student.status}`, 'info');
            renderView();
        }

        // Delete Student
        function deleteStudent(studentId) {
            if (!confirm('Are you sure you want to delete this student account? This also deletes their enrollments and progress.')) return;
            const db = getDB();
            db.users = db.users.filter(u => u.id !== studentId);
            db.enrollments = db.enrollments.filter(e => e.studentId !== studentId);
            db.progress = db.progress.filter(p => p.studentId !== studentId);
            saveDB(db);
            showToast('Student account deleted.', 'info');
            renderView();
        }

        // Delete Course
        function deleteCourse(courseId) {
            if (!confirm('Delete this course? All associated classes and enrollments will be deleted.')) return;
            const db = getDB();
            db.courses = db.courses.filter(c => c.id !== courseId);
            db.classes = db.classes.filter(c => c.courseId !== courseId);
            db.enrollments = db.enrollments.filter(e => e.courseId !== courseId);
            saveDB(db);
            showToast('Course and dependent classes removed.', 'info');
            renderView();
        }

        // Toggle Course Publish
        function toggleCoursePublish(courseId) {
            const db = getDB();
            const course = db.courses.find(c => c.id === courseId);
            if (!course) return;
            course.status = course.status === 'published' ? 'draft' : 'published';
            saveDB(db);
            showToast(`Course visibility toggled to ${course.status}`, 'info');
            renderView();
        }

        // Toggle Class Publish
        function togglePublishClass(classId) {
            const db = getDB();
            const cls = db.classes.find(c => c.id === classId);
            if (!cls) return;
            cls.published = !cls.published;
            saveDB(db);
            showToast(`Class is now ${cls.published ? 'Published' : 'Draft'}`, 'info');
            renderView();
        }

        // Delete Class
        function deleteClass(classId) {
            if (!confirm('Permanently delete this class?')) return;
            const db = getDB();
            db.classes = db.classes.filter(c => c.id !== classId);
            db.progress = db.progress.filter(p => p.classId !== classId);
            saveDB(db);
            showToast('Class module removed.', 'info');
            renderView();
        }

        // Toggle Enrollment Seat
        function toggleCourseSeat(studentId, courseId, shouldEnroll) {
            const db = getDB();
            if (shouldEnroll) {
                const exists = db.enrollments.some(e => e.studentId === studentId && e.courseId === courseId);
                if (!exists) {
                    db.enrollments.push({
                        id: 'enr_' + Math.random().toString(36).substr(2, 9),
                        studentId,
                        courseId,
                        assignedAt: new Date().toISOString().split('T')[0]
                    });
                }
            } else {
                db.enrollments = db.enrollments.filter(e => !(e.studentId === studentId && e.courseId === courseId));
            }
            saveDB(db);
            showToast('Enrollment permissions updated', 'success');
        }

        async function handleCreateStudentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('m-student-name').value.trim();
            const username = document.getElementById('m-student-username').value.trim();
            const password = document.getElementById('m-student-password').value;

            const db = getDB();
            if (db.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                showToast('Username already exists in Tech Gate Academy.', 'error');
                return;
            }

            const passwordHash = await sha256(password);
            const studentId = 'usr_' + Math.random().toString(36).substr(2, 9);

            const newStudent = {
                id: studentId,
                name,
                username,
                passwordHash,
                role: 'student',
                status: 'active',
                createdAt: new Date().toISOString().split('T')[0]
            };
            db.users.push(newStudent);

            // Assign checked courses
            const checkboxes = document.querySelectorAll('input[name="assign-course-checkbox"]:checked');
            checkboxes.forEach(cb => {
                db.enrollments.push({
                    id: 'enr_' + Math.random().toString(36).substr(2, 9),
                    studentId: studentId,
                    courseId: cb.value,
                    assignedAt: new Date().toISOString().split('T')[0]
                });
            });

            saveDB(db);
            closeModal();
            showToast(`Student ${name} successfully provisioned!`, 'success');
            renderView();
        }

            const description = document.getElementById('m-class-desc').value.trim();

            const progressBox = document.getElementById('upload-progress-box');
            const uploadBar = document.getElementById('upload-bar');
            const uploadPercent = document.getElementById('upload-percent');
            const submitBtn = document.getElementById('upload-submit-btn');

            progressBox.classList.remove('hidden');
            submitBtn.disabled = true;

            let currentProgress = 0;
            const interval = setInterval(() => {
                currentProgress += 25;
                uploadBar.style.width = currentProgress + '%';
                uploadPercent.innerText = currentProgress + '%';

                if (currentProgress >= 100) {
                    clearInterval(interval);
                    const db = getDB();
                    const newClass = {
                        id: 'cls_' + Math.random().toString(36).substr(2, 9),
                        courseId,
                        order,
                        title,
                        description,
                        videoUrl,
                        duration,
                        published
                    };
                    db.classes.push(newClass);
                    saveDB(db);
                    closeModal();
                    showToast('Video class successfully encoded & published!', 'success');
                    renderView();
                }
            }, 120);
        }

        // 4. RESET PASSWORD MODAL
        function openResetPasswordModal(studentId) {
            const db = getDB();
            const student = db.users.find(u => u.id === studentId);
            if (!student) return;

            modalContainer.innerHTML = `
                <div class="glass-panel p-6 rounded-2xl border border-slate-700 max-w-sm w-full shadow-2xl relative">
                    <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    <h2 class="text-lg font-bold text-white mb-1">Reset Password</h2>
                    <p class="text-xs text-slate-400 mb-4">Set a new password for student <span class="text-cyan-400 font-mono">@${student.username}</span></p>

                    <form onsubmit="handleResetPasswordSubmit(event, '${studentId}')" class="space-y-4">
                        <div>
                            <label class="block text-xs font-mono uppercase text-slate-300 mb-1">New Password</label>
                            <input type="text" id="m-new-password" required placeholder="Enter new password" class="w-full bg-dark-900 border border-slate-700 rounded-xl py-2 px-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                        </div>
                        <button type="submit" class="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs uppercase">
                            Update Student Password
                        </button>
                    </form>
                </div>
            `;
            modalContainer.classList.remove('hidden');
            lucide.createIcons();
        }

        async function handleResetPasswordSubmit(e, studentId) {
            e.preventDefault();
            const newPassword = document.getElementById('m-new-password').value;
            const db = getDB();
            const student = db.users.find(u => u.id === studentId);
            if (!student) return;

            student.passwordHash = await sha256(newPassword);
            saveDB(db);
            closeModal();
            showToast(`Password updated for @${student.username}`, 'success');
            renderView();
        }

        // 5. ASSIGN COURSES MODAL
        function openAssignModal(studentId) {
            const db = getDB();
            const student = db.users.find(u => u.id === studentId);
            const studentEnrollments = db.enrollments.filter(e => e.studentId === studentId).map(e => e.courseId);

            modalContainer.innerHTML = `
                <div class="glass-panel p-6 rounded-2xl border border-cyan-500/30 max-w-md w-full shadow-2xl relative">
                    <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    <h2 class="text-lg font-bold text-white mb-1">Assign Course Seats</h2>
                    <p class="text-xs text-slate-400 mb-4">Managing tracks for student: <span class="text-cyan-300 font-semibold">${student.name}</span></p>

                    <div class="space-y-2 mb-6">
                        ${db.courses.map(course => {
                            const isEnrolled = studentEnrollments.includes(course.id);
                            return `
                                <div class="flex items-center justify-between p-3 rounded-xl bg-dark-900 border border-slate-800">
                                    <div class="overflow-hidden pr-2">
                                        <p class="text-xs font-semibold text-white truncate">${course.title}</p>
                                        <span class="text-[10px] text-slate-500 font-mono">${course.status}</span>
                                    </div>
                                    <button onclick="toggleCourseSeat('${studentId}', '${course.id}', ${!isEnrolled}); openAssignModal('${studentId}');" class="px-3 py-1 rounded text-xs font-semibold ${isEnrolled ? 'bg-rose-950/60 text-rose-300 border border-rose-500/20' : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'}">
                                        ${isEnrolled ? 'Revoke' : 'Assign'}
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <button onclick="closeModal(); renderView();" class="w-full py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold">
                        Done & Close
                    </button>
                </div>
            `;
            modalContainer.classList.remove('hidden');
            lucide.createIcons();
        }

        // 6. DEMO CREDENTIALS HELPER
        function openDemoCredentials() {
            modalContainer.innerHTML = `
                <div class="glass-panel p-6 sm:p-8 rounded-2xl border border-cyan-500/40 max-w-md w-full shadow-2xl relative">
                    <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    <div class="flex items-center gap-2 mb-2 text-cyan-400 font-mono text-xs uppercase">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                        <span>Tech Gate Academy Credentials</span>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-4">Sample Logins For Testing</h2>

                    <div class="space-y-4 text-xs font-mono">
                        <div class="p-4 rounded-xl bg-amber-950/20 border border-amber-500/30">
                            <span class="text-amber-400 font-bold block mb-1">ADMINISTRATOR PORTAL</span>
                            <div>Username: <span class="text-white select-all">admin</span></div>
                            <div>Password: <span class="text-white select-all">admin123</span></div>
                            <span class="text-[11px] text-slate-400 block mt-1 font-sans">Full access to create courses, add students, upload video classes.</span>
                        </div>

                        <div class="p-4 rounded-xl bg-cyan-950/20 border border-cyan-500/30">
                            <span class="text-cyan-400 font-bold block mb-1">STUDENT 1 (Rahul Sharma)</span>
                            <div>Username: <span class="text-white select-all">rahul2026</span></div>
                            <div>Password: <span class="text-white select-all">rahul123</span></div>
                            <span class="text-[11px] text-slate-400 block mt-1 font-sans">Enrolled in AI Video Creation & Prompt Engineering courses.</span>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-900 border border-slate-700">
                            <span class="text-slate-300 font-bold block mb-1">STUDENT 2 (Alex Vance)</span>
                            <div>Username: <span class="text-white select-all">alex_cyber</span></div>
                            <div>Password: <span class="text-white select-all">123456</span></div>
                            <span class="text-[11px] text-slate-400 block mt-1 font-sans">Enrolled in Zero Trust & Cloud Defense track.</span>
                        </div>
                    </div>

                    <button onclick="closeModal()" class="w-full mt-6 py-2.5 rounded-xl bg-cyan-500 text-black font-bold text-xs uppercase">
                        Got It
                    </button>
                </div>
            `;
            modalContainer.classList.remove('hidden');
            lucide.createIcons();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('current-year').innerText = new Date().getFullYear();
            getDB(); // Ensure initialized
            updateNavbar();
            renderView();
        });
    </script>
</body>
</html>

<script>

function closeLoginModal() {
  document.getElementById('adminLoginModal').classList.add('hidden');
}

function handleLogin(event) {
  event.preventDefault();
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;

  if (user === 'admin' && pass === 'password123') {
    alert('Login Success! Welcome Admin.');
